[project]
name = "DocuPilot"
version = "0.0.1"
description = "Records the screen, audio and input events to create user manuals"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pyside6>=6.7",
    "mss (>=10.2.0,<11.0.0)",
    "pynput (>=1.8.1,<2.0.0)",
    # headless: OpenCV is used for image processing only, never to open a
    # window. The GUI build additionally links libGL and friends, which a
    # server, a container or a CI runner does not have.
    "opencv-python-headless (>=4.13.0.92,<5.0.0.0)",
    "openai-whisper (>=20250625)",
    "spacy (==3.8.13)",
    "de_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
    "numpy (>=2.4.6,<3.0.0)",
    "scipy (>=1.18,<2.0)",
    "scikit-learn (>=1.9,<2.0)",
    "anthropic (>=0.116,<1.0)",
    # spaCy's CLI does `from click import NoSuchOption` and used to get click
    # through typer. Since typer 0.27 that is no longer a dependency, so
    # importing spacy at all fails unless click is installed explicitly.
    # Declared here rather than left to chance, which is what hid the problem
    # on a developer machine where click came from somewhere else.
    "click (>=8.1,<9.0)",
]

[project.scripts]
docupilot = "docupilot.app:run"

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    "pytest>=9.0,<10",
]
docs = [
    "sphinx>=8.2",
    "furo>=2025.7",
    "myst-parser>=4.0",
    "sphinx-autoapi>=3.6",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=1.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docupilot"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
